services:
  - type: web
    name: Fake-News-Detecter
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PRODUCTION
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
