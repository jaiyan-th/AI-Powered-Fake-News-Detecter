services:
  fake-news-detector:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
